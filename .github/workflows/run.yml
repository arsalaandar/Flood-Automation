name: Flood Automation

on:
  # Three cron lines combine to give a genuinely uniform 45-minute
  # cadence (verified: every gap is exactly 45 min, 32 runs/day) -
  # GitHub cron can't express "every 45 min" in a single line since
  # 45 doesn't divide 60, but spreading it across a repeating 3-hour
  # cycle (hour%3==0 -> :00 and :45, hour%3==1 -> :30, hour%3==2 -> :15)
  # produces exact 45-min spacing forever: 00:00, 00:45, 01:30, 02:15,
  # 03:00, 03:45, 04:30, 05:15, 06:00, ...
  schedule:
    - cron: "0,45 0-23/3 * * *"
    - cron: "30 1-23/3 * * *"
    - cron: "15 2-23/3 * * *"
  # Lets you trigger a run manually from the Actions tab, useful for
  # testing without waiting for the schedule.
  workflow_dispatch:

# Needed so the workflow can commit logs/archives back to the repo.
permissions:
  contents: write

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run auto-fetcher (single pass)
        env:
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          JKIOFS_USER: ${{ secrets.JKIOFS_USER }}
          JKIOFS_PASS: ${{ secrets.JKIOFS_PASS }}
        run: python auto_fetcher_once.py

      - name: Commit logs and archived data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ data/processed/ || true
          git diff --staged --quiet || git commit -m "Automated run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push